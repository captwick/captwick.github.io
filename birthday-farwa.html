<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Farwa ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  min-height:100vh;
  background:#0b0720;
  font-family:'Lato',sans-serif;
  overflow-x:hidden;
  cursor:default;
}

/* ── STARFIELD ── */
#starfield{position:fixed;inset:0;z-index:0;pointer-events:none;}
.star-bg{position:absolute;border-radius:50%;background:#fff;animation:twinkle ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(.7)}50%{opacity:1;transform:scale(1)}}

/* ── AURORA ── */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
.aurora-band{position:absolute;width:200%;height:300px;opacity:.12;border-radius:50%;animation:drift ease-in-out infinite alternate;}
.a1{top:5%;left:-50%;background:linear-gradient(90deg,#b57bee,#7ec8e3,#b57bee);animation-duration:8s;}
.a2{top:20%;left:-30%;background:linear-gradient(90deg,#7ec8e3,#f9a8d4,#7ec8e3);animation-duration:11s;animation-delay:2s;}
.a3{bottom:10%;left:-40%;background:linear-gradient(90deg,#f9a8d4,#b57bee,#f9a8d4);animation-duration:9s;animation-delay:4s;}
@keyframes drift{from{transform:translateX(0) scaleY(1)}to{transform:translateX(8%) scaleY(1.3)}}

/* ── GLITTER PARTICLES ── */
.glitter-wrap{position:fixed;inset:0;z-index:1;pointer-events:none;}
.g{position:absolute;border-radius:50%;animation:glitter ease-in-out infinite;}
@keyframes glitter{0%,100%{opacity:0;transform:scale(0) translateY(0)}40%{opacity:1}60%{opacity:1}100%{opacity:0;transform:scale(1.5) translateY(-30px)}}

/* ── OPENING SCREEN ── */
#opening{
  position:fixed;inset:0;z-index:50;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  background:#0b0720;
  transition:opacity .8s ease;
}
.open-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(28px,6vw,52px);
  color:#f9a8d4;
  text-align:center;
  text-shadow:0 0 30px rgba(249,168,212,.6),0 0 60px rgba(181,123,238,.4);
  animation:titleFloat 3s ease-in-out infinite;
  line-height:1.3;
}
@keyframes titleFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.open-sub{
  font-family:'Lato',sans-serif;font-weight:300;
  color:#c4b5fd;font-size:16px;margin-top:16px;
  letter-spacing:3px;text-transform:uppercase;
  animation:fadeInUp .8s ease .5s both;
}
.open-btn{
  margin-top:40px;
  padding:14px 40px;
  border:1.5px solid rgba(249,168,212,.5);
  background:rgba(249,168,212,.08);
  color:#f9a8d4;
  font-family:'Playfair Display',serif;
  font-size:18px;
  font-style:italic;
  border-radius:50px;
  cursor:pointer;
  transition:all .3s;
  animation:fadeInUp .8s ease 1s both;
  backdrop-filter:blur(4px);
}
.open-btn:hover{background:rgba(249,168,212,.2);box-shadow:0 0 20px rgba(249,168,212,.3);transform:scale(1.04);}
.wand{font-size:36px;margin-bottom:16px;animation:wandWiggle 2s ease-in-out infinite;}
@keyframes wandWiggle{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* ── GAME SCREEN ── */
#game{
  position:relative;z-index:10;
  min-height:100vh;
  padding:20px 16px 40px;
  display:none;flex-direction:column;align-items:center;
}
.game-header{
  text-align:center;margin-bottom:8px;
  font-family:'Playfair Display',serif;
  color:#f9a8d4;font-size:15px;font-style:italic;
  letter-spacing:1px;
  text-shadow:0 0 12px rgba(249,168,212,.5);
}
.progress-bar-wrap{
  width:260px;height:6px;
  background:rgba(255,255,255,.1);
  border-radius:3px;margin-bottom:28px;overflow:hidden;
}
.progress-bar-fill{
  height:100%;border-radius:3px;
  background:linear-gradient(90deg,#b57bee,#f9a8d4);
  transition:width .5s ease;width:0%;
  box-shadow:0 0 8px rgba(249,168,212,.5);
}

/* ── BALLOON GRID ── */
.balloon-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  max-width:380px;width:100%;
  margin-bottom:20px;
}
.balloon-cell{position:relative;display:flex;flex-direction:column;align-items:center;}

/* ── BALLOON SVG ── */
.balloon{
  cursor:pointer;
  animation:floatBalloon ease-in-out infinite;
  transition:transform .15s;
  width:72px;
  filter:drop-shadow(0 4px 12px rgba(181,123,238,.4));
}
.balloon:hover{transform:scale(1.08);}
.balloon.popped{display:none;}
@keyframes floatBalloon{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

.balloon-string{
  width:1.5px;height:22px;
  background:rgba(255,255,255,.3);
  border-radius:1px;
  animation:floatBalloon ease-in-out infinite;
}

/* ── BALLOON COLORS ── */
.bc0{--bc:#f87fb1;}
.bc1{--bc:#b57bee;}
.bc2{--bc:#7ec8e3;}
.bc3{--bc:#fbbf6a;}
.bc4{--bc:#a7f3b4;}
.bc5{--bc:#f9a8d4;}
.bc6{--bc:#c4b5fd;}
.bc7{--bc:#fde68a;}

/* ── POP BURST ── */
.burst{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-60%);
  pointer-events:none;
  display:none;
}
.burst.show{display:block;}
.burst-particle{
  position:absolute;
  width:6px;height:6px;
  border-radius:50%;
  animation:burst .5s ease-out forwards;
}
@keyframes burst{
  0%{transform:translate(0,0) scale(1);opacity:1;}
  100%{transform:translate(var(--bx),var(--by)) scale(0);opacity:0;}
}

/* ── REVEAL CARD ── */
#reveal-overlay{
  position:fixed;inset:0;z-index:60;
  background:rgba(7,3,18,.85);
  backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;
  padding:20px;
}
#reveal-overlay.show{display:flex;}
.reveal-card{
  background:linear-gradient(145deg,rgba(30,10,60,.95),rgba(15,5,35,.98));
  border:1px solid rgba(249,168,212,.25);
  border-radius:20px;
  padding:28px 24px 24px;
  max-width:340px;width:100%;
  text-align:center;
  box-shadow:0 0 60px rgba(181,123,238,.2),0 0 120px rgba(249,168,212,.1);
  animation:cardPop .4s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes cardPop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.reveal-photo{
  width:200px;height:200px;
  object-fit:cover;
  border-radius:50%;
  border:3px solid rgba(249,168,212,.5);
  box-shadow:0 0 30px rgba(249,168,212,.3),0 0 60px rgba(181,123,238,.2);
  margin-bottom:20px;
}
.reveal-photo-placeholder{
  width:200px;height:200px;
  border-radius:50%;
  border:3px solid rgba(249,168,212,.5);
  background:rgba(249,168,212,.08);
  display:flex;align-items:center;justify-content:center;
  font-size:64px;margin-bottom:20px;
  box-shadow:0 0 30px rgba(249,168,212,.3);
}
.reveal-num{
  font-family:'Playfair Display',serif;
  font-size:12px;color:#c4b5fd;
  letter-spacing:3px;text-transform:uppercase;
  margin-bottom:8px;
}
.reveal-msg{
  font-family:'Playfair Display',serif;
  font-size:19px;font-style:italic;
  color:#f9a8d4;
  text-shadow:0 0 16px rgba(249,168,212,.4);
  line-height:1.5;margin-bottom:16px;
}
.reveal-sub{
  font-family:'Lato',sans-serif;font-weight:300;
  font-size:13px;color:#c4b5fd;
  line-height:1.6;margin-bottom:24px;
}
.reveal-close{
  padding:10px 32px;
  border:1.5px solid rgba(249,168,212,.4);
  background:rgba(249,168,212,.06);
  color:#f9a8d4;
  font-family:'Playfair Display',serif;
  font-size:15px;font-style:italic;
  border-radius:50px;cursor:pointer;
  transition:all .3s;
}
.reveal-close:hover{background:rgba(249,168,212,.18);box-shadow:0 0 16px rgba(249,168,212,.3);}

/* ── FINAL SCREEN ── */
#final{
  position:fixed;inset:0;z-index:70;
  background:#0b0720;
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  padding:30px 20px;text-align:center;
}
#final.show{display:flex;}
.final-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(28px,7vw,48px);
  color:#f9a8d4;
  text-shadow:0 0 30px rgba(249,168,212,.7),0 0 60px rgba(181,123,238,.5);
  animation:titleFloat 3s ease-in-out infinite;
  line-height:1.3;margin-bottom:16px;
}
.final-msg{
  font-family:'Playfair Display',serif;
  font-style:italic;font-size:17px;
  color:#c4b5fd;line-height:1.7;
  max-width:320px;margin-bottom:30px;
}
.final-photos{
  display:flex;gap:10px;flex-wrap:wrap;
  justify-content:center;margin-bottom:28px;
  max-width:360px;
}
.final-photo{
  width:70px;height:70px;
  object-fit:cover;border-radius:50%;
  border:2px solid rgba(249,168,212,.4);
  box-shadow:0 0 14px rgba(249,168,212,.3);
  animation:photoFloat ease-in-out infinite;
}
.final-photo-placeholder{
  width:70px;height:70px;border-radius:50%;
  border:2px solid rgba(249,168,212,.4);
  background:rgba(249,168,212,.08);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;
  animation:photoFloat ease-in-out infinite;
}
@keyframes photoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.firework{
  position:fixed;pointer-events:none;z-index:71;
  font-size:22px;animation:fireworkFly 1.2s ease-out forwards;
}
@keyframes fireworkFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--fx),var(--fy)) scale(0)}}
</style>
</head>
<body>

<!-- STARFIELD -->
<div id="starfield"></div>
<div class="aurora"><div class="aurora-band a1"></div><div class="aurora-band a2"></div><div class="aurora-band a3"></div></div>
<div class="glitter-wrap" id="glitter"></div>

<!-- ══════════════════════════════════
     OPENING SCREEN
══════════════════════════════════ -->
<div id="opening">
  <div class="wand">🪄</div>
  <div class="open-title">A little magic<br>for Farwa ✨</div>
  <div class="open-sub">a birthday surprise awaits</div>
  <button class="open-btn" onclick="startGame()">Open your gift →</button>
</div>

<!-- ══════════════════════════════════
     GAME SCREEN
══════════════════════════════════ -->
<div id="game">
  <div class="game-header">Pop the balloons to reveal your birthday surprises 🎈</div>
  <div class="progress-bar-wrap"><div class="progress-bar-fill" id="pbar"></div></div>
  <div class="balloon-grid" id="balloonGrid"></div>
</div>

<!-- ══════════════════════════════════
     REVEAL CARD OVERLAY
══════════════════════════════════ -->
<div id="reveal-overlay">
  <div class="reveal-card">
    <div id="reveal-photo-wrap"></div>
    <div class="reveal-num" id="reveal-num"></div>
    <div class="reveal-msg" id="reveal-msg"></div>
    <div class="reveal-sub" id="reveal-sub"></div>
    <button class="reveal-close" onclick="closeReveal()">Keep popping ✨</button>
  </div>
</div>

<!-- ══════════════════════════════════
     FINAL SCREEN
══════════════════════════════════ -->
<div id="final">
  <div class="final-title">Happy Birthday,<br>Farwa 🌙✨</div>
  <div class="final-msg">"Every star in tonight's sky is wishing you a year full of magic, laughter, and everything beautiful. You deserve it all."</div>
  <div class="final-photos" id="finalPhotos"></div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  CONFIGURATION — change photo filenames and messages
// ══════════════════════════════════════════════════════
const BALLOONS = [
  {
    photo: "photo1.jpg",
    emoji: "🌸",
    msg: "To the one who lights up every room",
    sub: "Your smile holds more warmth than all the stars combined. Wishing you a birthday as radiant as you are."
  },
  {
    photo: "photo2.jpg",
    emoji: "💜",
    msg: "A soul as rare as moonlight",
    sub: "There is something truly magical about the way you carry yourself — elegant, gentle, and full of grace."
  },
  {
    photo: "photo3.jpg",
    emoji: "✨",
    msg: "You were born to shine",
    sub: "Not just today, but every single day. May this year bring you everything your heart quietly dreams of."
  },
  {
    photo: "photo4.jpg",
    emoji: "🌙",
    msg: "My favourite kind of magic",
    sub: "If I could bottle the joy you bring and gift it back to you — that would be your birthday present."
  },
  {
    photo: "photo5.jpg",
    emoji: "🌷",
    msg: "Prettier than the whole universe",
    sub: "And that is truly saying something, because the universe is rather spectacular."
  },
  {
    photo: "photo6.jpg",
    emoji: "💫",
    msg: "Here's to you, Farwa",
    sub: "May every wish you make today find its way back to you a hundred times over."
  },
  {
    photo: "photo7.jpg",
    emoji: "🦋",
    msg: "Soft heart, strong spirit",
    sub: "The world is so much better with you in it. Never forget how deeply you are appreciated."
  },
  {
    photo: "photo8.jpg",
    emoji: "🌟",
    msg: "The last balloon holds the brightest wish",
    sub: "A year of adventure, peace, love, and all the little moments that make life feel like a fairy tale. Happy Birthday 🎂"
  }
];

const COLORS = ['#f87fb1','#b57bee','#7ec8e3','#fbbf6a','#a7f3b4','#f9a8d4','#c4b5fd','#fde68a'];
const COLOR_DARK = ['#c0145a','#6d28d9','#0e7490','#b45309','#059669','#db2777','#7c3aed','#b45309'];

let popped = 0;

// ── STARFIELD ──
const sf = document.getElementById('starfield');
for(let i=0;i<120;i++){
  const s=document.createElement('div');
  s.className='star-bg';
  const sz=.8+Math.random()*2;
  s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${1.5+Math.random()*3}s;animation-delay:${Math.random()*4}s`;
  sf.appendChild(s);
}

// ── GLITTER ──
const gl=document.getElementById('glitter');
const gc=['#f9a8d4','#c4b5fd','#fde68a','#ffffff','#7ec8e3'];
for(let i=0;i<35;i++){
  const g=document.createElement('div');
  g.className='g';
  const sz=2+Math.random()*4;
  g.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:${gc[i%gc.length]};animation-duration:${2+Math.random()*3}s;animation-delay:${Math.random()*4}s`;
  gl.appendChild(g);
}

// ── BUILD BALLOONS ──
function buildBalloons(){
  const grid=document.getElementById('balloonGrid');
  BALLOONS.forEach((b,i)=>{
    const cell=document.createElement('div');
    cell.className='balloon-cell';
    cell.innerHTML=`
      <svg class="balloon bc${i}" id="bal${i}" viewBox="0 0 80 110" onclick="popBalloon(${i})" style="animation-delay:${i*0.18}s">
        <ellipse cx="40" cy="42" rx="28" ry="34" fill="${COLORS[i]}" opacity=".95"/>
        <ellipse cx="30" cy="28" rx="9" ry="7" fill="white" opacity=".25"/>
        <path d="M40 76 Q38 84 40 90 Q42 84 40 76" fill="${COLOR_DARK[i]}" stroke="${COLOR_DARK[i]}" stroke-width="1.5"/>
        <polygon points="34,76 46,76 40,82" fill="${COLORS[i]}"/>
        <text x="40" y="48" text-anchor="middle" font-size="22" dy=".35em">${b.emoji}</text>
      </svg>
      <div class="balloon-string" style="animation-delay:${i*0.18}s"></div>
      <div class="burst" id="burst${i}"></div>
    `;
    grid.appendChild(cell);
  });
}

// ── POP BALLOON ──
function popBalloon(idx){
  if(document.getElementById('bal'+idx).classList.contains('popped')) return;
  // burst particles
  const burst=document.getElementById('burst'+idx);
  burst.classList.add('show');
  for(let i=0;i<10;i++){
    const p=document.createElement('div');
    p.className='burst-particle';
    const angle=Math.random()*360;
    const dist=30+Math.random()*40;
    p.style.cssText=`background:${COLORS[idx]};--bx:${Math.cos(angle)*dist}px;--by:${Math.sin(angle)*dist}px;animation-delay:${i*0.02}s`;
    burst.appendChild(p);
  }
  setTimeout(()=>{ burst.innerHTML=''; burst.classList.remove('show'); },600);

  // hide balloon
  document.getElementById('bal'+idx).classList.add('popped');
  document.getElementById('bal'+idx).style.display='none';

  popped++;
  document.getElementById('pbar').style.width=((popped/BALLOONS.length)*100)+'%';

  // show reveal after short delay
  setTimeout(()=>showReveal(idx), 300);
}

// ── SHOW REVEAL ──
function showReveal(idx){
  const b=BALLOONS[idx];
  const wrap=document.getElementById('reveal-photo-wrap');

  // Try image first, fallback to emoji
  const img=new Image();
  img.onload=()=>{
    wrap.innerHTML=`<img src="${b.photo}" class="reveal-photo" alt="">`;
  };
  img.onerror=()=>{
    wrap.innerHTML=`<div class="reveal-photo-placeholder">${b.emoji}</div>`;
  };
  img.src=b.photo;

  document.getElementById('reveal-num').textContent=`Surprise ${popped} of ${BALLOONS.length}`;
  document.getElementById('reveal-msg').textContent=b.msg;
  document.getElementById('reveal-sub').textContent=b.sub;

  const closeBtn=document.querySelector('.reveal-close');
  closeBtn.textContent = popped===BALLOONS.length ? "See the finale 🌟" : "Keep popping ✨";

  document.getElementById('reveal-overlay').classList.add('show');
}

// ── CLOSE REVEAL ──
function closeReveal(){
  document.getElementById('reveal-overlay').classList.remove('show');
  if(popped===BALLOONS.length){
    setTimeout(showFinal, 400);
  }
}

// ── FINAL SCREEN ──
function showFinal(){
  const f=document.getElementById('final');
  const fp=document.getElementById('finalPhotos');
  f.classList.add('show');

  BALLOONS.forEach((b,i)=>{
    const img=new Image();
    img.onload=()=>{
      const el=document.createElement('img');
      el.src=b.photo;
      el.className='final-photo';
      el.style.animationDelay=(i*0.15)+'s';
      fp.appendChild(el);
    };
    img.onerror=()=>{
      const el=document.createElement('div');
      el.className='final-photo-placeholder';
      el.textContent=b.emoji;
      el.style.animationDelay=(i*0.15)+'s';
      fp.appendChild(el);
    };
    img.src=b.photo;
  });

  // fireworks
  launchFireworks();
  setInterval(launchFireworks, 2000);
}

function launchFireworks(){
  const emojis=['✨','🌟','💫','⭐','🎉','🎊','🌸','💜'];
  for(let i=0;i<12;i++){
    setTimeout(()=>{
      const f=document.createElement('div');
      f.className='firework';
      f.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      const sx=10+Math.random()*80;
      const sy=20+Math.random()*60;
      const fx=(Math.random()-0.5)*200;
      const fy=-(80+Math.random()*120);
      f.style.cssText=`left:${sx}%;top:${sy}%;--fx:${fx}px;--fy:${fy}px;animation-delay:${i*0.08}s`;
      document.body.appendChild(f);
      setTimeout(()=>f.remove(),1400);
    },i*80);
  }
}

// ── START ──
function startGame(){
  const o=document.getElementById('opening');
  o.style.opacity='0';
  setTimeout(()=>{
    o.style.display='none';
    const g=document.getElementById('game');
    g.style.display='flex';
    buildBalloons();
  },800);
}
</script>
</body>
</html>
